{% extends "base.html" %}
{% block title %}Register | BookVerse{% endblock %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-8 col-lg-6">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus-fill text-primary display-5"></i>
        <h3 class="fw-bold mt-2">Create Your Account</h3>
        <p class="text-secondary small">Join BookVerse Online Bookshop</p>
      </div>

      <form action="{{ url_for('register') }}" method="POST">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small text-secondary">Username</label>
            <input type="text" name="username" class="form-control" placeholder="praveen_reader" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small text-secondary">Full Name</label>
            <input type="text" name="full_name" class="form-control" placeholder="Pidamarthi Praveen Kumar" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small text-secondary">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="praveenkumarpidamarthi01@gmail.com" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small text-secondary">Phone Number</label>
            <input type="text" name="phone" class="form-control" placeholder="+91 8317668826">
          </div>
          <div class="col-12">
            <label class="form-label small text-secondary">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
          </div>
          <div class="col-12">
            <label class="form-label small text-secondary">Shipping Address</label>
            <input type="text" name="address" class="form-control" placeholder="Street Address / Landmark">
          </div>
          <div class="col-md-6">
            <label class="form-label small text-secondary">City</label>
            <input type="text" name="city" class="form-control" value="Hyderabad">
          </div>
          <div class="col-md-6">
            <label class="form-label small text-secondary">PIN Code</label>
            <input type="text" name="postal_code" class="form-control" value="500075">
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-4 mb-3">Register Account</button>
      </form>

      <div class="text-center small text-secondary">
        Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
